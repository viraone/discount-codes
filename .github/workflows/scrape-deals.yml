name: Scrape live deals

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/scrape-deals.yml"

permissions:
  contents: write

concurrency:
  group: scrape-deals
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scraper/fetch.js
      - name: Commit updated deals
        run: |
          git config user.name "deals-bot"
          git config user.email "deals-bot@users.noreply.github.com"
          git add data/live-deals.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: refresh live deals $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
